<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Activity Report - Harrisburg</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #2563eb;
      --text: #e5e7eb;
      --border: #374151;
      --input-bg: #2d3748;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card {
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    label {
      font-size: 0.75rem;
      color: #9ca3af;
      display: block;
      margin-bottom: 2px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button.btn-danger {
      background: #dc2626;
    }
    button.btn-success {
      background: #16a34a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
    }
    th {
      background: #2d3748;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 10px 12px;
      background: #2d3748;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Integrated Industries</h1>
  
  <!-- Header Info & Shift Progress -->
  <div class="card">
    <div class="grid-2">
      <div>
        <label>Mechanic Name</label>
        <input type="text" id="mechanicName" value="Jose R">
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="repairDate">
      </div>
    </div>
    <div class="grid-2" style="margin-top: 8px;">
      <div>
        <label>Start Time</label>
        <input type="time" id="startTime">
      </div>
      <div>
        <label>End Time</label>
        <input type="time" id="endTime">
      </div>
    </div>

    <!-- Progress Bar placed under Mechanic Info -->
    <div class="stats-bar">
      <span>Total Production Hours:</span>
      <span id="totalHours" style="color: #60a5fa; font-size: 1.1rem;">0.0 hrs</span>
    </div>
  </div>

  <!-- Entry Form -->
  <div class="card">
    <div class="section-title">Quick Unit Entry</div>
    <div class="grid-3">
      <div>
        <label>Unit Init</label>
        <input type="text" id="unitInit" placeholder="e.g. TRL" style="text-transform:uppercase;">
      </div>
      <div>
        <label>Unit #</label>
        <input type="text" id="unitNum" placeholder="123456">
      </div>
      <div>
        <label>Tag Code</label>
        <input type="text" id="tagCode" placeholder="Code">
      </div>
    </div>

    <!-- Separate Tires Section -->
    <div style="margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border);">
      <div class="section-title">Tires Installed / Replaced</div>
      <div class="grid-3">
        <div>
          <label>10.00.20</label>
          <input type="number" id="c100020" placeholder="Qty" min="0">
        </div>
        <div>
          <label>11R22.5 Tires</label>
          <input type="number" id="c11r225" placeholder="Qty" min="0">
        </div>
        <div>
          <label>11R22.55</label>
          <input type="number" id="c11r2255" placeholder="Qty" min="0">
        </div>
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label>Hours Spent</label>
      <input type="number" id="hoursSpent" step="0.1" placeholder="0.0">
    </div>

    <button onclick="addEntry()">+ Add Entry</button>
  </div>

  <!-- Activity Table (Unit Number and Hours) -->
  <div class="card" style="overflow-x:auto;">
    <div class="section-title">Today's Logged Activity</div>
    <table id="logTable">
      <thead>
        <tr>
          <th>Unit Number</th>
          <th>Hours</th>
          <th style="width: 50px;">Action</th>
        </tr>
      </thead>
      <tbody id="logBody">
      </tbody>
    </table>
  </div>

  <!-- Comments & Controls -->
  <div class="card">
    <label>Comments</label>
    <textarea id="comments" rows="3" placeholder="Shift notes or comments..."></textarea>
    <div class="grid-2" style="margin-top: 8px;">
      <button class="btn-success" onclick="exportCSV()">Export to CSV</button>
      <button class="btn-danger" onclick="clearLog()">Clear Sheet</button>
    </div>
  </div>
</div>

<script>
  let entries = JSON.parse(localStorage.getItem('dailyLog')) || [];

  // Initialize date to today
  document.getElementById('repairDate').valueAsDate = new Date();

  function renderTable() {
    const tbody = document.getElementById('logBody');
    tbody.innerHTML = '';
    let hoursSum = 0;

    entries.forEach((item, index) => {
      const parsedHours = parseFloat(item.hours) || 0;
      hoursSum += parsedHours;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.unitInit ? item.unitInit + ' ' : ''}${item.unitNum}</td>
        <td>${item.hours ? item.hours + ' hrs' : '-'}</td>
        <td><button style="padding:2px 6px; background:#dc2626;" onclick="deleteEntry(${index})">X</button></td>
      `;
      tbody.appendChild(row);
    });

    document.getElementById('totalHours').innerText = hoursSum.toFixed(1) + ' hrs';
    localStorage.setItem('dailyLog', JSON.stringify(entries));
  }

  function addEntry() {
    const unitInit = document.getElementById('unitInit').value.toUpperCase();
    const unitNum = document.getElementById('unitNum').value;
    const tag = document.getElementById('tagCode').value;
    const c10 = document.getElementById('c100020').value;
    const c11r = document.getElementById('c11r225').value;
    const c11r55 = document.getElementById('c11r2255').value;
    const hours = document.getElementById('hoursSpent').value;

    if (!unitNum && !hours) return alert('Please enter at least a Unit # or Hours.');

    entries.push({ unitInit, unitNum, tag, c10, c11r, c11r55, hours });
    renderTable();

    // Clear inputs for fast re-entry
    document.getElementById('unitInit').value = '';
    document.getElementById('unitNum').value = '';
    document.getElementById('tagCode').value = '';
    document.getElementById('c100020').value = '';
    document.getElementById('c11r225').value = '';
    document.getElementById('c11r2255').value = '';
    document.getElementById('hoursSpent').value = '';
    document.getElementById('unitInit').focus();
  }

  function deleteEntry(index) {
    entries.splice(index, 1);
    renderTable();
  }

  function clearLog() {
    if (confirm('Clear all entries for the current log?')) {
      entries = [];
      renderTable();
    }
  }

  function exportCSV() {
    let csv = "Mechanic,Date,Start,End\n";
    csv += `"${document.getElementById('mechanicName').value}","${document.getElementById('repairDate').value}","${document.getElementById('startTime').value}","${document.getElementById('endTime').value}"\n\n`;
    csv += "Unit Init,Unit Number,Tag Code,10.00.20,11R22.5 Tires,11R22.55,Hours\n";

    entries.forEach(e => {
      csv += `"${e.unitInit}","${e.unitNum}","${e.tag}","${e.c10}","${e.c11r}","${e.c11r55}","${e.hours}"\n`;
    });

    csv += `\nComments: "${document.getElementById('comments').value}"\n`;

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.setAttribute('download', `Daily_Report_${document.getElementById('repairDate').value}.csv`);
    a.click();
  }

  renderTable();
</script>
</body>
</html>
