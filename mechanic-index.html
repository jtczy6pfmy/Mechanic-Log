<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanic Repair Log</title>
  <style>
    :root{--bg:#111827;--card:#1f2937;--input:#374151;--border:#4b5563;--text:#f3f4f6;--muted:#9ca3af;--blue:#2563eb;--green:#16a34a;--red:#dc2626;}
    *{box-sizing:border-box}
    body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .container{max-width:950px;margin:auto}
    h1{text-align:center;font-size:1.35rem;letter-spacing:1px;margin:5px 0 15px;text-transform:uppercase}
    .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
    .title{font-size:.82rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:4px}
    input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);border-radius:6px;color:#fff;padding:10px;font-size:1rem}
    select{appearance:auto}
    textarea{resize:vertical;min-height:85px}
    button{width:100%;border:0;border-radius:7px;padding:11px;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:10px;background:var(--blue)}
    .danger{background:var(--red)}
    .total{background:#0f172a;border:2px solid var(--blue);border-radius:10px;text-align:center;padding:14px;margin-top:12px}
    .total-label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
    .total-hours{font-size:2.2rem;font-weight:800;color:#60a5fa;margin-top:3px}
    .entry{border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:9px;background:#182230}
    .entry-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
    .entry-hours{color:#60a5fa;font-size:1.05rem;white-space:nowrap}
    .entry-meta{font-size:.82rem;color:var(--muted);margin-top:5px;line-height:1.5}
    .entry-work{margin-top:8px;white-space:pre-wrap;font-size:.9rem}
    .entry-comment{margin-top:7px;color:#d1d5db;font-size:.88rem;white-space:pre-wrap}
    .empty{text-align:center;color:var(--muted);padding:18px 5px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .small-delete{width:auto;margin:0;padding:6px 9px;background:var(--red);font-size:.78rem}
    @media(max-width:650px){.grid,.grid-3,.actions{grid-template-columns:1fr}h1{font-size:1.15rem}.total-hours{font-size:2rem}}
  </style>
</head>
<body>
<div class="container">
  <h1>Mechanic Repair Log</h1>

  <div class="card">
    <div class="title">Daily Information</div>
    <div class="grid">
      <div>
        <label>Mechanic</label>
        <select id="mechanic">
          <option value="">Select Mechanic</option>
          <option>Jose R</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Repair Yard / Location</label>
        <select id="location">
          <option value="">Select Location</option>
          <option>Harrisburg</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div>
        <label>Date</label>
        <input type="date" id="repairDate">
      </div>
      <div class="total" style="margin:0;padding:9px">
        <div class="total-label">Current Total Hours</div>
        <div class="total-hours" id="totalHours">0.0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">Repair Entry</div>
    <div class="grid">
      <div>
        <label>Chassis Prefix</label>
        <select id="prefix">
          <option value="">Select</option>
          <option>NSPZ</option>
          <option>NSFZ</option>
        </select>
      </div>
      <div>
        <label>Chassis Number</label>
        <input id="chassis" inputmode="numeric" maxlength="6" placeholder="123456">
      </div>
    </div>

    <div class="grid" style="margin-top:10px">
      <div>
        <label>Repair Hours From Work Order</label>
        <input type="number" id="hours" min="0" step="0.1" placeholder="0.0">
      </div>
      <div>
        <label>Work Done</label>
        <input id="workDone" placeholder="Describe repair / work completed">
      </div>
    </div>

    <div style="margin-top:10px">
      <label>Comments</label>
      <textarea id="comment" placeholder="Use this for reasons production hours were not met, delays, waiting on parts, etc."></textarea>
    </div>

    <button onclick="addEntry()">+ ADD REPAIR</button>
  </div>

  <div class="card">
    <div class="title">Today's Work</div>
    <div id="entries"></div>
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="exportCSV()">EXPORT CSV</button>
      <button class="danger" onclick="clearLog()">CLEAR TODAY</button>
    </div>
  </div>
</div>

<script>
const STORAGE='mechanicRepairLog_v2';
let entries=JSON.parse(localStorage.getItem(STORAGE)||'[]');
const date=document.getElementById('repairDate');
date.valueAsDate=new Date();

function save(){localStorage.setItem(STORAGE,JSON.stringify(entries));}
function render(){
  const box=document.getElementById('entries');
  box.innerHTML='';
  let total=0;
  entries.forEach((e,i)=>{
    total+=Number(e.hours)||0;
    const div=document.createElement('div');
    div.className='entry';
    div.innerHTML=`
      <div class="entry-head">
        <span>${e.prefix} ${e.chassis}</span>
        <span class="entry-hours">${Number(e.hours||0).toFixed(1)} hrs</span>
        <button class="small-delete" onclick="deleteEntry(${i})">DELETE</button>
      </div>
      <div class="entry-meta">${escapeHtml(e.location)} • ${escapeHtml(e.mechanic)}</div>
      <div class="entry-work"><strong>Work:</strong> ${escapeHtml(e.workDone||'Not specified')}</div>
      ${e.comment?`<div class="entry-comment"><strong>Comment:</strong> ${escapeHtml(e.comment)}</div>`:''}`;
    box.appendChild(div);
  });
  if(!entries.length) box.innerHTML='<div class="empty">No repairs logged yet today.</div>';
  document.getElementById('totalHours').textContent=total.toFixed(1)+' hrs';
  save();
}
function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function addEntry(){
  const mechanic=document.getElementById('mechanic').value;
  const location=document.getElementById('location').value;
  const prefix=document.getElementById('prefix').value;
  const chassis=document.getElementById('chassis').value.trim();
  const hours=document.getElementById('hours').value;
  const workDone=document.getElementById('workDone').value.trim();
  const comment=document.getElementById('comment').value.trim();
  if(!mechanic)return alert('Please select the mechanic.');
  if(!location)return alert('Please select the repair yard / location.');
  if(!prefix)return alert('Please select NSPZ or NSFZ.');
  if(!/^\d{6}$/.test(chassis))return alert('Enter the 6-digit chassis number.');
  if(hours===''||Number(hours)<0)return alert('Enter the repair hours from the work order.');
  if(!workDone)return alert('Please enter the work done.');
  entries.push({mechanic,location,prefix,chassis,hours:Number(hours),workDone,comment,date:date.value});
  document.getElementById('chassis').value='';
  document.getElementById('hours').value='';
  document.getElementById('workDone').value='';
  document.getElementById('comment').value='';
  render();
  document.getElementById('prefix').focus();
}
function deleteEntry(i){entries.splice(i,1);render();}
function clearLog(){if(confirm('Clear all repair entries for today?')){entries=[];render();}}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function exportCSV(){
  let csv='Mechanic,Location,Date,Chassis,Repair Hours,Work Done,Comments\n';
  entries.forEach(e=>{csv+=[e.mechanic,e.location,e.date,`${e.prefix} ${e.chassis}`,e.hours,e.workDone,e.comment].map(csvEscape).join(',')+'\n';});
  const total=entries.reduce((s,e)=>s+(Number(e.hours)||0),0);
  csv+='\nDaily Total Hours,'+csvEscape(total.toFixed(1))+'\n';
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`Mechanic_Log_${date.value||'today'}.csv`;a.click();URL.revokeObjectURL(url);
}
render();
</script>
</body>
</html>
