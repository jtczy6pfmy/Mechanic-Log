<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechanic Repair Log</title>
<style>
:root{--bg:#111827;--card:#1f2937;--input:#374151;--border:#4b5563;--text:#f3f4f6;--muted:#9ca3af;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.container{max-width:900px;margin:auto}h1{text-align:center;font-size:1.35rem;letter-spacing:1px;margin:5px 0 15px;text-transform:uppercase}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}.title{font-size:.82rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:4px}input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);border-radius:6px;color:#fff;padding:10px;font-size:1rem}textarea{resize:vertical;min-height:85px}button{width:100%;border:0;border-radius:7px;padding:11px;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:10px;background:var(--blue)}.danger{background:var(--red)}.total{background:#0f172a;border:2px solid var(--blue);border-radius:10px;text-align:center;padding:14px;margin-top:10px}.total-label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.total-hours{font-size:2.2rem;font-weight:800;color:#60a5fa;margin-top:3px}.weekly{background:#172033;border:1px solid #475569;border-radius:10px;text-align:center;padding:13px;margin-top:10px}.weekly-hours{font-size:1.8rem;font-weight:800;color:#93c5fd;margin-top:3px}.weekly-range{font-size:.75rem;color:var(--muted);margin-top:3px}.tire-card{background:#172033;border:1px solid #475569;border-radius:8px;padding:11px;margin-top:10px}.tire-title{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}.entry{border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:9px;background:#182230}.entry-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}.entry-hours{color:#60a5fa;white-space:nowrap}.entry-meta,.entry-comment{font-size:.86rem;color:#d1d5db;margin-top:6px}.delete{width:auto;margin:0;padding:6px 9px;background:var(--red);font-size:.75rem}.empty{text-align:center;color:var(--muted);padding:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}h1{font-size:1.15rem}}
</style>
</head>
<body>
<div class="container">
<h1>Mechanic Repair Log</h1>
<div class="card">
<div class="title">Daily Information</div>
<div class="grid">
<div><label>Mechanic Name</label><select id="mechanic"><option value="">Select Mechanic</option><option>Jose R</option><option>Other</option></select></div>
<div><label>Repair Yard / Location</label><select id="location"><option value="">Select Location</option><option>Harrisburg</option><option>Other</option></select></div>
</div>
<div class="grid" style="margin-top:10px">
<div><label>Shift Worked</label><select id="shift"><option value="">Select Shift</option><option>6-2:30</option><option>12-8</option><option>8-5:30</option></select></div>
<div><label>Date</label><input type="date" id="repairDate"></div>
</div>
<div class="total"><div class="total-label">Current Total Hours Completed</div><div class="total-hours" id="totalHours">0.0 hrs</div></div>
<div class="weekly"><div class="total-label">Weekly Tally — Completed Hours</div><div class="weekly-hours" id="weeklyHours">0.0 hrs</div><div class="weekly-range" id="weeklyRange"></div></div>
</div>
<div class="card">
<div class="title">Repair Entry</div>
<div class="grid">
<div><label>Chassis Prefix</label><select id="prefix"><option value="">Select</option><option>NSPZ</option><option>NSFZ</option></select></div>
<div><label>Chassis Number</label><input id="chassis" inputmode="numeric" maxlength="6" placeholder="123456"></div>
</div>
<div style="margin-top:10px"><label>Repair Hours From Work Order</label><input type="number" id="hours" min="0" step="0.1" placeholder="0.0"></div>
<div class="tire-card">
<div class="tire-title">Tires Changed</div>
<div class="grid">
<div><label>11R22.5 Quantity Changed</label><input type="number" id="tire11225" min="0" step="1" value="0" inputmode="numeric"></div>
<div><label>10.00.20 Quantity Changed</label><input type="number" id="tire100020" min="0" step="1" value="0" inputmode="numeric"></div>
</div>
</div>
<div style="margin-top:10px"><label>Comments — Reason Production Hours Were Not Met</label><textarea id="comment" placeholder="Parts delay, waiting on chassis, additional repair, etc."></textarea></div>
<button id="addBtn">+ ADD REPAIR</button>
</div>
<div class="card"><div class="title">Today's Work</div><div id="entries"></div></div>
<div class="card"><div class="actions"><button id="exportBtn">EXPORT CSV</button><button class="danger" id="clearBtn">CLEAR TODAY</button></div></div>
</div>
<script>
const KEY='mechanicRepairLog_v6';let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){entries=[]}
const $=id=>document.getElementById(id);$('repairDate').valueAsDate=new Date();
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateOnly(d){return new Date(d+'T00:00:00')}
function weekStart(dateStr){let d=dateOnly(dateStr),day=d.getDay();let diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d}
function isoDate(d){return d.toISOString().slice(0,10)}
function formatDate(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function renderWeekly(){let selected=$('repairDate').value||isoDate(new Date()),start=weekStart(selected),end=new Date(start);end.setDate(end.getDate()+6);let startKey=isoDate(start),endKey=isoDate(end);let weeklyTotal=entries.filter(e=>e.date>=startKey&&e.date<=endKey).reduce((s,e)=>s+(Number(e.hours)||0),0);$('weeklyHours').textContent=weeklyTotal.toFixed(1)+' hrs';$('weeklyRange').textContent=formatDate(start)+' – '+formatDate(end)}
function render(){let selectedDate=$('repairDate').value;let todayEntries=entries.filter(e=>e.date===selectedDate);let total=todayEntries.reduce((s,e)=>s+(Number(e.hours)||0),0);$('totalHours').textContent=total.toFixed(1)+' hrs';renderWeekly();let box=$('entries');if(!todayEntries.length){box.innerHTML='<div class="empty">No repairs logged for this date.</div>';save();return}box.innerHTML=todayEntries.map(e=>{let i=entries.indexOf(e);return `<div class="entry"><div class="entry-head"><span>${esc(e.prefix)} ${esc(e.chassis)}</span><span class="entry-hours">${Number(e.hours).toFixed(1)} hrs</span><button class="delete" onclick="removeEntry(${i})">DELETE</button></div><div class="entry-meta">${esc(e.mechanic)} • ${esc(e.location)} • Shift ${esc(e.shift||'')}</div><div class="entry-meta">11R22.5: ${Number(e.tire11225)||0} &nbsp; | &nbsp; 10.00.20: ${Number(e.tire100020)||0}</div>${e.comment?`<div class="entry-comment"><strong>Comment:</strong> ${esc(e.comment)}</div>`:''}</div>`}).join('');save()}
function add(){let mechanic=$('mechanic').value,location=$('location').value,shift=$('shift').value,prefix=$('prefix').value,chassis=$('chassis').value.trim(),hours=$('hours').value,comment=$('comment').value.trim(),tire11225=$('tire11225').value,tire100020=$('tire100020').value,date=$('repairDate').value;if(!mechanic)return alert('Select a mechanic.');if(!location)return alert('Select the repair yard.');if(!shift)return alert('Select the shift worked.');if(!prefix)return alert('Select NSPZ or NSFZ.');if(!/^\d{6}$/.test(chassis))return alert('Enter a 6-digit chassis number.');if(hours===''||Number(hours)<0)return alert('Enter the repair hours from the work order.');if(tire11225===''||Number(tire11225)<0||!Number.isInteger(Number(tire11225)))return alert('Enter a whole-number quantity for 11R22.5 tires.');if(tire100020===''||Number(tire100020)<0||!Number.isInteger(Number(tire100020)))return alert('Enter a whole-number quantity for 10.00.20 tires.');entries.push({mechanic,location,shift,prefix,chassis,hours:Number(hours),tire11225:Number(tire11225),tire100020:Number(tire100020),comment,date});$('chassis').value='';$('hours').value='';$('tire11225').value='0';$('tire100020').value='0';$('comment').value='';render();$('prefix').focus()}
function removeEntry(i){entries.splice(i,1);render()}
function clearToday(){let date=$('repairDate').value;if(confirm('Clear all repairs for '+date+'?')){entries=entries.filter(e=>e.date!==date);render()}}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){let out='Mechanic,Location,Shift,Date,Chassis,Repair Hours,11R22.5 Quantity Changed,10.00.20 Quantity Changed,Comments\n';entries.forEach(e=>out+=[e.mechanic,e.location,e.shift,e.date,e.prefix+' '+e.chassis,e.hours,Number(e.tire11225)||0,Number(e.tire100020)||0,e.comment].map(csv).join(',')+'\n');let selected=$('repairDate').value,start=weekStart(selected),end=new Date(start);end.setDate(end.getDate()+6);let startKey=isoDate(start),endKey=isoDate(end);let weekly=entries.filter(e=>e.date>=startKey&&e.date<=endKey).reduce((s,e)=>s+(Number(e.hours)||0),0);out+='\nWeekly Completed Hours,'+csv(weekly.toFixed(1))+'\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='Mechanic_Log_'+selected+'.csv';a.click()}
$('addBtn').onclick=add;$('clearBtn').onclick=clearToday;$('exportBtn').onclick=exportCSV;$('repairDate').onchange=render;render();
</script>
</body></html>
